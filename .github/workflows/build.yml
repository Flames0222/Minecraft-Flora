name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod jar
        run: ./gradlew build --no-daemon
      - name: Run game tests
        run: ./gradlew runGameTestServer --no-daemon
      - name: Check the game log for data errors
        run: |
          test -f run/logs/latest.log
          if grep -E "ERROR|WARN" run/logs/latest.log | grep -i "mcflora"; then
            echo "::error::mcflora data produced errors or warnings while loading (see above)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mcflora-jar
          path: build/libs/*.jar
      - name: Commit the jar to release/
        if: github.event_name == 'push'
        run: |
          mkdir -p release
          rm -f release/*.jar
          cp build/libs/*.jar release/
          git add -A release
          if git diff --cached --quiet; then
            echo "Jar unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update release jar [skip ci]"
            git push
          fi
